services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trollwatch
      POSTGRES_PASSWORD: trollwatch_dev
      POSTGRES_DB: trollwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trollwatch -d trollwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
